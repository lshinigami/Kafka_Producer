services:

  kafka-producer-demo:
    build: .
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    networks:
      - demo-network
    depends_on:
      db-producer:
        condition: service_healthy
      db-consumer:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT}
      DB_URL: ${PRODUCER_DB_URL}
      DB_USERNAME: ${PRODUCER_DB_USERNAME}
      DB_PASSWORD: ${PRODUCER_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

  db-producer:
    image: postgres:15
    container_name: database-producer
    networks:
      - demo-network
    environment:
      POSTGRES_DB: ${PRODUCER_DB_NAME}
      POSTGRES_USER: ${PRODUCER_DB_USERNAME}
      POSTGRES_PASSWORD: ${PRODUCER_DB_PASSWORD}
    ports:
      - "${PRODUCER_DB_EXTERNAL_PORT}:${PRODUCER_DB_INTERNAL_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PRODUCER_DB_USERNAME} -d ${PRODUCER_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  #    volumes:
  #      - ./pgdata:/var/lib/postgresql/data

  db-consumer:
    image: postgres:15
    container_name: database-consumer
    networks:
      - demo-network
    environment:
      POSTGRES_DB: ${CONSUMER_DB_NAME}
      POSTGRES_USER: ${CONSUMER_DB_USERNAME}
      POSTGRES_PASSWORD: ${CONSUMER_DB_PASSWORD}
    ports:
      - "${CONSUMER_DB_EXTERNAL_PORT}:${CONSUMER_DB_INTERNAL_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${CONSUMER_DB_USERNAME} -d ${CONSUMER_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  #    volumes:
  #      - ./pgdata:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks:
      - demo-network
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "srvr,ruok"
    healthcheck:
      test: [ "CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.7.8
    networks:
      - demo-network
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_EXTERNAL_PORT}:${KAFKA_INTERNAL_PORT}"
      - "127.0.0.1:${KAFKA_INTERNAL_PORT}:${KAFKA_INTERNAL_PORT}"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - demo-network
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CLUSTERS_0_ZOOKEEPER: ${KAFKA_ZOOKEEPER_CONNECT}

networks:
  demo-network:
    driver: bridge

volumes:
  pgdata:
